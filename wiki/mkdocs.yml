site_name: Crisis Cadres
site_url: https://crisis-cadres.com
site_description: Crisis Cadres is an open-source playbook for community resilience.
  We take a realistic, pessimistic view of climate and societal collapse and turn
  it into pragmatic, local action. Small, committed groups called cadres build self-sufficiency
  through committees focused on production, procurement, education, and security.
site_author: The Salish Sea Cadre
repo_url: https://github.com/crisis-cadres/praxis-hub
repo_name: praxis-hub
theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
  - scheme: slate
    primary: orange
    accent: indigo
    toggle:
      icon: material/weather-night
      name: Switch to light mode
  - scheme: default
    primary: orange
    accent: indigo
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  features:
  - navigation.top
  - navigation.indexes
extra:
  homepage: /
extra_css:
- assets/extra.css
