name: Build and Deploy Wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r wiki/requirements.txt

      - name: Generate markdown
        run: python wiki/generate.py

      - name: Build site
        run: mkdocs build -f wiki/mkdocs.yml -d site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: wiki/site
          cname: crisis-cadres.com
